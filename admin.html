<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電商商品與促銷中控台</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --card: #1f2937;
      --input-bg: #030712;
      --border: #374151;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #38bdf8;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --save: #f59e0b;
      --inst: #a855f7;
      --star: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 14px; }
    .title { font-weight: 700; font-size: 15px; color: #fff; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #374151; color: #fff; border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: 0.15s;
    }
    .btn:hover { background: #4b5563; }
    .btn-primary { background: var(--primary); color: #022c22; border: none; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }
    .btn-toggle { background: #1e293b; color: #fbbf24; border: 1px solid #4b5563; width: 100%; justify-content: center; }

    .main-layout { display: flex; flex: 1; overflow: hidden; }

    /* 左側清單 */
    .sidebar {
      width: 270px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    }
    .sidebar-filter { padding: 10px 14px; border-bottom: 1px solid var(--border); background: #182234; }
    .series-group { margin-bottom: 8px; border-bottom: 1px solid rgba(55, 65, 81, 0.4); }
    .series-header {
      padding: 8px 14px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .product-btn-wrapper {
      display: flex; align-items: center; border-bottom: 1px solid rgba(55, 65, 81, 0.2);
    }
    .product-btn-wrapper:hover { background: rgba(255,255,255,0.04); }
    .star-btn {
      padding: 8px 10px; cursor: pointer; font-size: 15px; color: #4b5563;
      transition: 0.15s; user-select: none;
    }
    .star-btn.active { color: var(--star); }
    .product-btn {
      flex: 1; padding: 9px 12px 9px 4px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: #d1d5db; transition: 0.15s;
    }
    .product-btn.active { color: #fff; font-weight: 700; }
    .count-badge { background: rgba(0,0,0,0.3); color: #9ca3af; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

    /* 右側主工作區 */
    .content-area { flex: 1; padding: 20px; overflow-y: auto; }
    .group-wrapper { max-width: 1350px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    .product-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .product-box-title {
      background: #1e293b; padding: 12px 20px; font-size: 17px; font-weight: 700;
      color: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }

    .spec-table { width: 100%; border-collapse: collapse; }
    .spec-table th {
      background: rgba(0,0,0,0.25); text-align: left; padding: 10px 10px;
      font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border);
    }
    .spec-table td {
      padding: 10px 10px; border-bottom: 1px solid rgba(55, 65, 81, 0.4);
      font-size: 13px; vertical-align: middle;
    }
    .spec-table tr:last-child td { border-bottom: none; }

    .val-pill {
      display: inline-block; padding: 4px 8px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: 6px; font-weight: 600; font-size: 12px; color: #e5e7eb;
    }
    .val-code { font-family: monospace; color: var(--accent); background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); }
    .val-sale { color: #6ee7b7; background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); }

    .price-input {
      width: 110px; padding: 6px 8px; background: var(--input-bg);
      border: 1px solid #f43f5e; border-radius: 6px; color: #fda4af;
      font-size: 13px; font-weight: 700; outline: none; transition: 0.15s;
    }
    .price-input:focus { box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.3); }

    .text-input {
      width: 100%; min-width: 120px; padding: 6px 8px; background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 6px; color: #fff;
      font-size: 12px; outline: none;
    }
    .text-input:focus { border-color: var(--primary); }

    .save-tag { color: var(--save); font-weight: 700; }
    .inst-tag { color: var(--inst); font-weight: 600; font-size: 12px; }

    #loginMask {
      position: fixed; inset: 0; background: var(--bg); display: flex;
      align-items: center; justify-content: center; z-index: 2000;
    }
    .login-box { background: var(--panel); padding: 28px; border-radius: 10px; width: 380px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div id="loginMask">
  <div class="login-box">
    <h3 style="margin-bottom: 12px; font-size: 16px;">後台金鑰驗證</h3>
    <div style="margin-bottom: 14px;">
      <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">GitHub Token：</label>
      <input type="text" id="tokenInput" placeholder="ghp_..." style="width: 100%; padding: 8px 10px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; color: #fff;">
    </div>
    <button class="btn btn-primary" style="width: 100%;" onclick="login()">驗證進入</button>
  </div>
</div>

<header>
  <div class="header-left">
    <div class="title">⚡ 促銷中控台</div>
    <span style="font-size: 12px; color: #10b981; background: rgba(16,185,129,0.1); padding: 4px 8px; border-radius: 4px;">● 雲端試算表自動聯網中</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; color: var(--text-muted);">⏰ 活動倒數截止：</span>
      <input type="datetime-local" id="countdownEnd" style="padding: 4px 8px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; color: #fff; font-size: 12px;">
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-primary" onclick="saveToGitHub()">🚀 儲存並發布到全站</button>
  </div>
</header>

<div class="main-layout">
  <div class="sidebar">
    <div class="sidebar-filter">
      <button class="btn btn-toggle" id="filterBtn" onclick="toggleHeroFilter()">
        ⭐ 切換：僅看主力熱賣商品
      </button>
    </div>
    <div id="seriesList" style="flex: 1; overflow-y: auto;"></div>
  </div>

  <div class="content-area">
    <div id="groupWrapper" class="group-wrapper"></div>
  </div>
</div>

<script>
  const OWNER = "svokh888-del";
  const REPO = "shop-data";
  const PATH = "data.js";
  const GSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEWo8c-SSz0VwsT6ntnoi8ib6fQvByBl7wVnIAQ0C8DaLW6wqiwkdXpYlznFHOiNrFqF6ponss-1rd/pub?gid=0&single=true&output=csv";

  let currentFileSha = "";
  let shopData = { countdownEnd: "", heroProducts: {}, products: {} };
  if (!shopData.heroProducts) shopData.heroProducts = {};
  let selectedProductKey = "";
  let onlyHeroMode = false;

  const SERIES_COLORS = {
    "AEMIS": { bg: "rgba(16, 185, 129, 0.1)", border: "#10b981", text: "#6ee7b7" },
    "B": { bg: "rgba(56, 189, 248, 0.1)", border: "#38bdf8", text: "#7dd3fc" },
    "FEMOIRE": { bg: "rgba(236, 72, 153, 0.1)", border: "#ec4899", text: "#f472b6" },
    "Zenso": { bg: "rgba(245, 158, 11, 0.1)", border: "#f59e0b", text: "#fcd34d" },
    "MOVEON": { bg: "rgba(168, 85, 247, 0.1)", border: "#a855f7", text: "#c084fc" },
    "預設": { bg: "rgba(100, 116, 139, 0.1)", border: "#64748b", text: "#cbd5e1" }
  };

  function getSeriesStyle(series) {
    return SERIES_COLORS[series] || SERIES_COLORS["預設"];
  }

  function login() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) return alert("請輸入 Token 金鑰");
    localStorage.setItem("gh_token", token);
    loadData();
  }

  window.onload = function() {
    const token = localStorage.getItem("gh_token");
    if (token) {
      document.getElementById("tokenInput").value = token;
      loadData();
    }
  };

  async function loadData() {
    const token = localStorage.getItem("gh_token");
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      if (!res.ok) throw new Error("讀取失敗，請確認 Token 與權限");
      const json = await res.json();
      currentFileSha = json.sha;
      const decoded = decodeURIComponent(escape(atob(json.content)));
      
      const match = decoded.match(/window\.SHOP_DATA\s*=\s*(\{[\s\S]*\});?/);
      if (match && match[1]) {
        shopData = eval(`(${match[1]})`);
        if (!shopData.heroProducts) shopData.heroProducts = {};
      }
      document.getElementById("loginMask").style.display = "none";
      document.getElementById("countdownEnd").value = shopData.countdownEnd || "";
      
      // 自動連網讀取 Google 試算表最新數據
      await fetchGoogleSheetCSVAuto();
      renderSidebar();
    } catch (e) {
      alert(e.message);
    }
  }

  function toggleHeroFilter() {
    onlyHeroMode = !onlyHeroMode;
    document.getElementById("filterBtn").innerText = onlyHeroMode ? "📋 顯示全部系列" : "⭐ 切換：僅看主力熱賣商品";
    renderSidebar();
  }

  function toggleHeroProduct(chName, event) {
    event.stopPropagation();
    shopData.heroProducts[chName] = !shopData.heroProducts[chName];
    renderSidebar();
  }

  function calcInstallment(price) {
    const p = Number(price);
    if (!p || isNaN(p) || p < 3000) return "不能分期";
    if (p >= 12000) return `12期 ($${Math.round(p / 12).toLocaleString()}/期)`;
    if (p >= 6000) return `6期 ($${Math.round(p / 6).toLocaleString()}/期)`;
    if (p >= 3000) return `3期 ($${Math.round(p / 3).toLocaleString()}/期)`;
    return "不能分期";
  }

  function parseCSVLine(text) {
    const p = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        inQuote = !inQuote;
      } else if (c === ',' && !inQuote) {
        p.push(cur.trim().replace(/^["']|["']$/g, ''));
        cur = '';
      } else {
        cur += c;
      }
    }
    p.push(cur.trim().replace(/^["']|["']$/g, ''));
    return p;
  }

  // 自動同步試算表
  async function fetchGoogleSheetCSVAuto() {
    try {
      const res = await fetch(GSHEET_CSV_URL + "&t=" + new Date().getTime());
      if (!res.ok) return;
      const text = await res.text();
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      if (lines.length === 0) return;

      const header = parseCSVLine(lines[0]);
      const idx = {
        code: header.findIndex(h => h.includes("代碼")),
        series: header.findIndex(h => h.includes("系列")),
        eng: header.findIndex(h => h.includes("英文")),
        ch: header.findIndex(h => h.includes("中文")),
        unit: header.findIndex(h => h.includes("組")),
        content: header.findIndex(h => h.includes("內容")),
        orig: header.findIndex(h => h.includes("原價")),
        sale: header.findIndex(h => h.includes("優惠價"))
      };

      if (idx.code === -1) return;

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        const code = cols[idx.code];
        if (!code || code === "商品代碼") continue;

        if (!shopData.products[code]) shopData.products[code] = {};

        const series = idx.series !== -1 ? cols[idx.series] : "其他";
        const eng = idx.eng !== -1 ? cols[idx.eng] : "";
        const ch = idx.ch !== -1 ? cols[idx.ch] : "";
        const unit = idx.unit !== -1 ? cols[idx.unit] : "1";
        const content = idx.content !== -1 ? cols[idx.content] : "";
        const orig = idx.orig !== -1 ? cols[idx.orig].replace(/,/g, '') : "";
        const sale = idx.sale !== -1 ? cols[idx.sale].replace(/,/g, '') : "";

        shopData.products[code].series = series || "其他";
        shopData.products[code].english = eng;
        shopData.products[code].chineseName = ch || code;
        shopData.products[code].unitCount = unit || "1";
        shopData.products[code].spec = content ? `${content} (${unit}組)` : `${unit}組`;
        shopData.products[code].originalPrice = orig;
        shopData.products[code].regularSalePrice = sale; // 固定的優惠價
      }
    } catch (e) {
      console.warn("自動同步失敗", e);
    }
  }

  function renderSidebar() {
    const list = document.getElementById("seriesList");
    list.innerHTML = "";

    const hierarchy = {};
    for (const [code, item] of Object.entries(shopData.products)) {
      const chName = item.chineseName || code;
      const isHero = !!shopData.heroProducts[chName];

      if (onlyHeroMode && !isHero) continue;

      const series = item.series || "其他系列";
      if (!hierarchy[series]) hierarchy[series] = {};
      if (!hierarchy[series][chName]) hierarchy[series][chName] = [];
      hierarchy[series][chName].push(code);
    }

    let firstKey = "";

    Object.keys(hierarchy).sort().forEach(series => {
      const style = getSeriesStyle(series);
      const group = document.createElement("div");
      group.className = "series-group";
      group.style.backgroundColor = style.bg;

      const header = document.createElement("div");
      header.className = "series-header";
      header.style.color = style.text;
      header.innerHTML = `<span>${series} 系列</span>`;
      group.appendChild(header);

      Object.keys(hierarchy[series]).sort().forEach(chName => {
        const codes = hierarchy[series][chName];
        if (!firstKey) firstKey = chName;

        const isHero = !!shopData.heroProducts[chName];

        const itemWrap = document.createElement("div");
        itemWrap.className = "product-btn-wrapper";

        const star = document.createElement("span");
        star.className = `star-btn ${isHero ? 'active' : ''}`;
        star.innerHTML = "⭐";
        star.title = "點擊設為主力商品";
        star.onclick = (e) => toggleHeroProduct(chName, e);

        const btn = document.createElement("div");
        btn.className = `product-btn ${chName === (selectedProductKey || firstKey) ? 'active' : ''}`;
        btn.innerHTML = `
          <span>${chName}</span>
          <span class="count-badge">${codes.length}組</span>
        `;
        btn.onclick = () => {
          selectedProductKey = chName;
          renderSidebar();
          renderContent(chName, codes);
        };

        itemWrap.appendChild(star);
        itemWrap.appendChild(btn);
        group.appendChild(itemWrap);
      });

      list.appendChild(group);
    });

    if (!selectedProductKey) selectedProductKey = firstKey;
    let activeCodes = [];
    for (const s of Object.keys(hierarchy)) {
      if (hierarchy[s][selectedProductKey]) {
        activeCodes = hierarchy[s][selectedProductKey];
        break;
      }
    }
    renderContent(selectedProductKey, activeCodes);
  }

  function renderContent(chName, codes) {
    const container = document.getElementById("groupWrapper");
    container.innerHTML = "";
    if (!codes || codes.length === 0) return;

    const box = document.createElement("div");
    box.className = "product-box";

    let rowsHtml = "";
    codes.forEach(code => {
      const item = shopData.products[code];
      const origRaw = item.originalPrice;
      const isOrigPending = (origRaw === "待補" || origRaw === "" || origRaw === undefined);
      const origDisplay = isOrigPending ? "待補" : `$${Number(origRaw).toLocaleString()}`;
      
      const regSale = item.regularSalePrice ?? "";
      const regSaleDisplay = (regSale === "" || regSale === "待補") ? "待補" : `$${Number(regSale).toLocaleString()}`;

      // 活動特價若無輸入則為空
      const promoSale = item.promoSalePrice ?? "";
      const effectivePrice = promoSale !== "" ? promoSale : regSale;

      let saveHtml = "-";
      if (!isOrigPending && effectivePrice !== "" && effectivePrice !== "待補") {
        const save = Number(origRaw) - Number(effectivePrice);
        saveHtml = save > 0 ? `<span class="save-tag">省 $${save.toLocaleString()}</span>` : `$0`;
      }

      const instText = calcInstallment(effectivePrice);

      rowsHtml += `
        <tr>
          <td><span class="val-pill val-code">${code}</span></td>
          <td><span class="val-pill">${item.unitCount || '1'} 組</span></td>
          <td><span class="val-pill">${origDisplay}</span></td>
          <td><span class="val-pill val-sale">${regSaleDisplay}</span></td>
          <td>
            <input type="text" class="price-input" id="promo_${code}" value="${promoSale}" placeholder="空白=照優惠價" oninput="handleRowChange('${code}', '${origRaw}', '${regSale}')">
          </td>
          <td><span class="val-pill">${item.spec || '-'}</span></td>
          <td id="save_${code}">${saveHtml}</td>
          <td id="inst_${code}"><span class="inst-tag">${instText}</span></td>
          <td>
            <input type="text" class="text-input" id="discount_${code}" value="${item.promoDiscount || ''}" placeholder="例: 滿2盒9折 / 買二送一" oninput="handleRowChange('${code}', '${origRaw}', '${regSale}')">
          </td>
          <td>
            <input type="text" class="text-input" id="gift_${code}" value="${item.giftReward || ''}" placeholder="例: 贈隨身瓶" oninput="handleRowChange('${code}', '${origRaw}', '${regSale}')">
          </td>
        </tr>
      `;
    });

    box.innerHTML = `
      <div class="product-box-title">
        <span>📦 ${chName}</span>
        <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">共 ${codes.length} 個規格項目</span>
      </div>
      <table class="spec-table">
        <thead>
          <tr>
            <th style="width: 75px;">代碼</th>
            <th style="width: 65px;">組數</th>
            <th style="width: 90px;">原價 (唯讀)</th>
            <th style="width: 100px;">優惠價 (唯讀)</th>
            <th style="width: 130px;">🔥 快閃活動特價</th>
            <th style="width: 110px;">規格內容</th>
            <th style="width: 95px;">現省多少</th>
            <th style="width: 140px;">分期付款</th>
            <th style="width: 140px;">活動折扣設定</th>
            <th style="width: 150px;">滿額贈禮</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
    container.appendChild(box);
  }

  function handleRowChange(code, origRaw, regSale) {
    const promoSale = document.getElementById(`promo_${code}`).value.trim();
    const discount = document.getElementById(`discount_${code}`).value.trim();
    const gift = document.getElementById(`gift_${code}`).value.trim();

    shopData.products[code].promoSalePrice = promoSale;
    shopData.products[code].promoDiscount = discount;
    shopData.products[code].giftReward = gift;

    const currentPrice = promoSale !== "" ? promoSale : regSale;

    const saveEl = document.getElementById(`save_${code}`);
    if (origRaw !== "待補" && origRaw !== "" && currentPrice !== "" && currentPrice !== "待補") {
      const save = Number(origRaw) - Number(currentPrice);
      shopData.products[code].saveAmount = save > 0 ? save : 0;
      saveEl.innerHTML = save > 0 ? `<span class="save-tag">省 $${save.toLocaleString()}</span>` : `$0`;
    } else {
      saveEl.innerHTML = "-";
      shopData.products[code].saveAmount = 0;
    }

    const instEl = document.getElementById(`inst_${code}`);
    const instText = calcInstallment(currentPrice);
    shopData.products[code].installmentText = instText;
    instEl.innerHTML = `<span class="inst-tag">${instText}</span>`;
  }

  async function saveToGitHub() {
    const token = localStorage.getItem("gh_token");
    shopData.countdownEnd = document.getElementById("countdownEnd").value;

    const fileContent = "window.SHOP_DATA = " + JSON.stringify(shopData, null, 2) + ";";
    const encoded = btoa(unescape(encodeURIComponent(fileContent)));

    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Update shop-data: Auto Sheet Sync with Hero Category Stars",
          content: encoded,
          sha: currentFileSha
        })
      });

      if (!res.ok) throw new Error("儲存失敗，請檢查網路狀態");
      const data = await res.json();
      currentFileSha = data.content.sha;
      alert("🎉 儲存成功！全站資料庫已同步更新！");
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
