<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電商商品與促銷中控後台 (護眼版)</title>
  <style>
    :root {
      --bg: #121417;
      --card-bg: #1e2229;
      --card-inner: #262c36;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #38bdf8;
      --border: #333a46;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); margin-bottom: 24px; border: 1px solid var(--border); }
    h2 { font-size: 18px; margin-bottom: 16px; border-left: 4px solid var(--primary); padding-left: 12px; color: #f8fafc; font-weight: 600; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-muted); }
    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-inner); color: #fff; font-size: 14px; outline: none; transition: 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--primary); color: #022c22; border: none; padding: 10px 20px;
      border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: var(--primary-hover); color: #fff; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
    .p-item { background: var(--card-inner); border: 1px solid var(--border); border-radius: 10px; padding: 16px; position: relative; }
    .p-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; color: #fff; }
    .tag { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-family: monospace; }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    #loginPanel { max-width: 440px; margin: 100px auto; }
    .save-bar { position: sticky; bottom: 20px; z-index: 100; text-align: center; }
    .save-bar .btn { padding: 15px 44px; font-size: 16px; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35); }
    .desc-box { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.6; }
  </style>
</head>
<body>

<div class="container">
  <!-- 登入卡片 -->
  <div id="loginPanel" class="card">
    <h2>後台登入驗證</h2>
    <div class="form-group">
      <label>GitHub Token 專屬金鑰：</label>
      <input type="text" id="tokenInput" placeholder="貼上 ghp_xxxxxxxxxxxx">
    </div>
    <button class="btn" style="width: 100%;" onclick="login()">解鎖進入後台</button>
  </div>

  <!-- 管理主面板 -->
  <div id="adminPanel" style="display: none;">
    <!-- 倒數時間 -->
    <div class="card">
      <h2>⏰ 限時促銷倒數設定</h2>
      <div class="form-group">
        <label>活動截止時間（結束後前台自動恢復原價，留空代表無倒數）：</label>
        <input type="datetime-local" id="countdownEnd">
      </div>
    </div>

    <!-- 試算表一鍵貼上匯入 -->
    <div class="card">
      <h2>📋 Google 試算表無腦貼上匯入</h2>
      <div class="desc-box">
        直接在 Google 試算表把包含「商品代碼、系列、品名、原價、優惠價...」的整排表格反白複製（連同欄位標題一起複製也沒問題），按貼上即可。系統會自動抓取需要的數據，其餘不相關欄位自動略過！
      </div>
      <textarea id="tsvInput" rows="5" placeholder="直接在此貼上（Ctrl + V）試算表內容..."></textarea>
      <button class="btn" style="margin-top: 10px;" onclick="importFromTSV()">自動智能辨識並填入</button>
    </div>

    <!-- 商品列表 -->
    <div class="card">
      <h2>📦 商品資料庫列表</h2>
      <div id="productContainer" class="product-grid"></div>
    </div>

    <!-- 儲存按鈕 -->
    <div class="save-bar">
      <button class="btn" onclick="saveToGitHub()">🚀 一鍵儲存並發布到全站</button>
    </div>
  </div>
</div>

<script>
  const OWNER = "svokh888-del";
  const REPO = "shop-data";
  const PATH = "data.js";
  let currentFileSha = "";
  let shopData = { countdownEnd: "", products: {} };

  function login() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) return alert("請輸入 Token 金鑰");
    localStorage.setItem("gh_token", token);
    loadData();
  }

  window.onload = function() {
    const token = localStorage.getItem("gh_token");
    if (token) {
      document.getElementById("tokenInput").value = token;
      loadData();
    }
  };

  async function loadData() {
    const token = localStorage.getItem("gh_token");
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      if (!res.ok) throw new Error("讀取失敗，請確認 Token 是否正確且已勾選 repo 權限");
      const json = await res.json();
      currentFileSha = json.sha;
      const decodedContent = decodeURIComponent(escape(atob(json.content)));
      
      const match = decodedContent.match(/window\.SHOP_DATA\s*=\s*(\{[\s\S]*\});?/);
      if (match && match[1]) {
        shopData = eval(`(${match[1]})`);
      }
      renderAdmin();
      document.getElementById("loginPanel").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
    } catch (e) {
      alert(e.message);
    }
  }

  function renderAdmin() {
    document.getElementById("countdownEnd").value = shopData.countdownEnd || "";
    const container = document.getElementById("productContainer");
    container.innerHTML = "";

    for (const [code, item] of Object.entries(shopData.products)) {
      const div = document.createElement("div");
      div.className = "p-item";
      div.innerHTML = `
        <div class="p-header">
          <span style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.name || code}</span>
          <span class="tag">${code}</span>
        </div>
        <div class="row">
          <div class="form-group">
            <label>原價</label>
            <input type="text" id="orig_${code}" value="${item.originalPrice ?? ''}">
          </div>
          <div class="form-group">
            <label>優惠價</label>
            <input type="text" id="sale_${code}" value="${item.salePrice ?? ''}">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>促銷標籤 (例: 買3送1)</label>
            <input type="text" id="promo_${code}" value="${item.promoTitle || ''}">
          </div>
          <div class="form-group">
            <label>規格描述 (例: 20入×3盒)</label>
            <input type="text" id="spec_${code}" value="${item.spec || ''}">
          </div>
        </div>
        <div class="form-group">
          <label>贈品名稱 (無贈品留空)</label>
          <input type="text" id="gift_${code}" value="${item.giftName || ''}" placeholder="例: 虎奶菇養氣飲體驗包">
        </div>
        <div class="form-group">
          <label>分期付款折扣說明 (留空則不顯示)</label>
          <input type="text" id="inst_${code}" value="${item.installmentText || ''}" placeholder="例: 3期0利率">
        </div>
      `;
      container.appendChild(div);
    }
  }

  function importFromTSV() {
    const raw = document.getElementById("tsvInput").value.trim();
    if (!raw) return alert("請先貼上試算表內容！");
    const rows = raw.split("\n");
    let count = 0;

    rows.forEach(row => {
      const cols = row.split("\t").map(c => c.trim());
      // 判斷是否為標題列，如果是直接跳過
      if (cols[0] === "商品代碼" || cols[0] === "") return;

      const code = cols[0]; // A 欄: 商品代碼
      if (!code) return;

      if (!shopData.products[code]) {
        shopData.products[code] = {};
      }

      // 如果有中文名稱欄位(E欄)
      const engName = cols[3] || "";
      const chName = cols[4] || "";
      const groupCount = cols[5] ? `${cols[5]}組` : "";
      shopData.products[code].name = `${engName} ${chName} ${groupCount}`.trim() || shopData.products[code].name || code;
      
      // 內容規格(G欄)
      if (cols[6]) {
        shopData.products[code].spec = cols[6] + (cols[5] ? ` (共${cols[5]}組)` : "");
      }

      // 處理原價(H欄) 與 優惠價(I欄)
      const parsePrice = (val) => {
        if (!val || val === "待補") return "";
        const num = Number(val.replace(/,/g, ''));
        return isNaN(num) ? "" : num;
      };

      const origPrice = parsePrice(cols[7]);
      const salePrice = parsePrice(cols[8]);

      if (origPrice !== "") shopData.products[code].originalPrice = origPrice;
      if (salePrice !== "") shopData.products[code].salePrice = salePrice;

      // 現省(J欄)
      const savePrice = parsePrice(cols[9]);
      if (savePrice !== "") {
        shopData.products[code].saveAmount = savePrice;
      } else if (origPrice && salePrice && origPrice > salePrice) {
        shopData.products[code].saveAmount = origPrice - salePrice;
      }

      // 分期(K欄)
      if (cols[10]) {
        shopData.products[code].installmentText = cols[10];
      }

      count++;
    });

    renderAdmin();
    alert(`🎉 智能辨識完成！已成功抓取並更新 ${count} 筆商品，請檢視下方卡片並點擊「儲存發布」！`);
    document.getElementById("tsvInput").value = "";
  }

  async function saveToGitHub() {
    const token = localStorage.getItem("gh_token");
    shopData.countdownEnd = document.getElementById("countdownEnd").value;

    for (const code of Object.keys(shopData.products)) {
      const origInput = document.getElementById(`orig_${code}`);
      const saleInput = document.getElementById(`sale_${code}`);
      const promoInput = document.getElementById(`promo_${code}`);
      const specInput = document.getElementById(`spec_${code}`);
      const giftInput = document.getElementById(`gift_${code}`);
      const instInput = document.getElementById(`inst_${code}`);

      if (origInput) {
        const orig = origInput.value === "" ? "" : Number(origInput.value);
        const sale = saleInput.value === "" ? "" : Number(saleInput.value);
        shopData.products[code].originalPrice = orig;
        shopData.products[code].salePrice = sale;
        shopData.products[code].saveAmount = (orig && sale && orig > sale) ? (orig - sale) : 0;
        shopData.products[code].promoTitle = promoInput.value;
        shopData.products[code].spec = specInput.value;
        shopData.products[code].giftName = giftInput.value;
        shopData.products[code].installmentText = instInput.value;
      }
    }

    const fileContent = "window.SHOP_DATA = " + JSON.stringify(shopData, null, 2) + ";";
    const encoded = btoa(unescape(encodeURIComponent(fileContent)));

    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Update shop-data via Dark Mode Admin",
          content: encoded,
          sha: currentFileSha
        })
      });

      if (!res.ok) throw new Error("儲存失敗，請確認網路或金鑰狀態");
      const data = await res.json();
      currentFileSha = data.content.sha;
      alert("🎉 儲存發布成功！所有設定已同步寫入 GitHub！");
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
