<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電商商品與促銷中控台</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --card: #1f2937;
      --input-bg: #030712;
      --border: #374151;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #38bdf8;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --save: #f59e0b;
      --inst: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
    .title { font-weight: 700; font-size: 15px; color: #fff; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #374151; color: #fff; border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: 0.15s;
    }
    .btn:hover { background: #4b5563; }
    .btn-sync { background: #2563eb; color: #fff; border: none; }
    .btn-sync:hover { background: #1d4ed8; }
    .btn-primary { background: var(--primary); color: #022c22; border: none; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }

    .main-layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 250px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    }
    .series-header {
      padding: 12px 16px 4px 16px; font-size: 11px; font-weight: 700;
      color: var(--accent); letter-spacing: 0.05em; text-transform: uppercase;
    }
    .product-btn {
      padding: 10px 16px; cursor: pointer; border-bottom: 1px solid rgba(55, 65, 81, 0.2);
      display: flex; justify-content: space-between; align-items: center; font-size: 13px;
      transition: 0.15s; color: #d1d5db;
    }
    .product-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
    .product-btn.active { background: #1e293b; border-left: 4px solid var(--accent); color: #fff; font-weight: 700; }
    .count-badge { background: #374151; color: #9ca3af; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

    .content-area { flex: 1; padding: 24px; overflow-y: auto; }
    .group-wrapper { max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    .product-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .product-box-title {
      background: #1e293b; padding: 14px 20px; font-size: 18px; font-weight: 700;
      color: #fff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
    }

    .spec-table { width: 100%; border-collapse: collapse; }
    .spec-table th {
      background: rgba(0,0,0,0.25); text-align: left; padding: 10px 12px;
      font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border);
    }
    .spec-table td {
      padding: 10px 12px; border-bottom: 1px solid rgba(55, 65, 81, 0.4);
      font-size: 13px; vertical-align: middle;
    }
    .spec-table tr:last-child td { border-bottom: none; }

    .val-pill {
      display: inline-block; padding: 4px 8px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: 6px; font-weight: 600; font-size: 12px; color: #e5e7eb;
    }
    .val-code { font-family: monospace; color: var(--accent); background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); }

    .price-input {
      width: 100px; padding: 6px 8px; background: var(--input-bg);
      border: 1px solid var(--accent); border-radius: 6px; color: #38bdf8;
      font-size: 13px; font-weight: 700; outline: none; transition: 0.15s;
    }
    .text-input {
      width: 100%; min-width: 130px; padding: 6px 8px; background: var(--input-bg);
      border: 1px solid var(--border); border-radius: 6px; color: #fff;
      font-size: 12px; outline: none; transition: 0.15s;
    }
    .text-input:focus, .price-input:focus { border-color: var(--primary); }

    .save-tag { color: var(--save); font-weight: 700; }
    .inst-tag { color: var(--inst); font-weight: 600; font-size: 12px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none;
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-box {
      background: var(--panel); width: 90%; max-width: 550px; border-radius: 10px;
      padding: 20px; border: 1px solid var(--border);
    }
    #loginMask {
      position: fixed; inset: 0; background: var(--bg); display: flex;
      align-items: center; justify-content: center; z-index: 2000;
    }
    .login-box { background: var(--panel); padding: 28px; border-radius: 10px; width: 380px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<div id="loginMask">
  <div class="login-box">
    <h3 style="margin-bottom: 12px; font-size: 16px;">後台金鑰驗證</h3>
    <div style="margin-bottom: 14px;">
      <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">GitHub Token：</label>
      <input type="text" id="tokenInput" placeholder="ghp_..." style="width: 100%; padding: 8px 10px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; color: #fff;">
    </div>
    <button class="btn btn-primary" style="width: 100%;" onclick="login()">驗證進入</button>
  </div>
</div>

<header>
  <div class="header-left">
    <div class="title">⚡ 促銷中控台</div>
    <button class="btn btn-sync" onclick="fetchFromGoogleSheet()">🔄 一鍵線上同步試算表</button>
    <button class="btn" onclick="openModal()">📋 手動貼上</button>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; color: var(--text-muted);">⏰ 倒數截止：</span>
      <input type="datetime-local" id="countdownEnd" style="padding: 4px 8px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; color: #fff; font-size: 12px;">
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-primary" onclick="saveToGitHub()">🚀 儲存並發布到全站</button>
  </div>
</header>

<div class="main-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content-area">
    <div id="groupWrapper" class="group-wrapper"></div>
  </div>
</div>

<div id="importModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-bottom: 8px; font-size: 15px;">手動貼上 Google 試算表</h3>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">
      反白試算表複製後貼上：
    </p>
    <textarea id="tsvInput" rows="8" placeholder="在此貼上 (Ctrl+V)..." style="width: 100%; padding: 8px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 12px; outline: none;"></textarea>
    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px;">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="importFromTSV()">解析匯入</button>
    </div>
  </div>
</div>

<script>
  const OWNER = "svokh888-del";
  const REPO = "shop-data";
  const PATH = "data.js";
  const GSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEWo8c-SSz0VwsT6ntnoi8ib6fQvByBl7wVnIAQ0C8DaLW6wqiwkdXpYlznFHOiNrFqF6ponss-1rd/pub?gid=0&single=true&output=csv";

  let currentFileSha = "";
  let shopData = { countdownEnd: "", products: {} };
  let selectedProductKey = "";

  function openModal() { document.getElementById("importModal").style.display = "flex"; }
  function closeModal() { document.getElementById("importModal").style.display = "none"; }

  function login() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) return alert("請輸入 Token 金鑰");
    localStorage.setItem("gh_token", token);
    loadData();
  }

  window.onload = function() {
    const token = localStorage.getItem("gh_token");
    if (token) {
      document.getElementById("tokenInput").value = token;
      loadData();
    }
  };

  async function loadData() {
    const token = localStorage.getItem("gh_token");
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      if (!res.ok) throw new Error("讀取失敗，請確認 Token 與權限");
      const json = await res.json();
      currentFileSha = json.sha;
      const decoded = decodeURIComponent(escape(atob(json.content)));
      
      const match = decoded.match(/window\.SHOP_DATA\s*=\s*(\{[\s\S]*\});?/);
      if (match && match[1]) {
        shopData = eval(`(${match[1]})`);
      }
      document.getElementById("loginMask").style.display = "none";
      document.getElementById("countdownEnd").value = shopData.countdownEnd || "";
      renderSidebar();
    } catch (e) {
      alert(e.message);
    }
  }

  function calcInstallment(price) {
    const p = Number(price);
    if (!p || isNaN(p) || p < 3000) return "不能分期";
    if (p >= 12000) return `12期 (約 $${Math.round(p / 12).toLocaleString()}/期)`;
    if (p >= 6000) return `6期 (約 $${Math.round(p / 6).toLocaleString()}/期)`;
    if (p >= 3000) return `3期 (約 $${Math.round(p / 3).toLocaleString()}/期)`;
    return "不能分期";
  }

  function buildHierarchy() {
    const hierarchy = {};
    for (const [code, item] of Object.entries(shopData.products)) {
      const series = item.series || "其他系列";
      const english = item.english || "OTHER";
      const chName = item.chineseName || item.name || code;

      if (!hierarchy[series]) hierarchy[series] = {};
      if (!hierarchy[series][english]) hierarchy[series][english] = {};
      if (!hierarchy[series][english][chName]) hierarchy[series][english][chName] = [];

      hierarchy[series][english][chName].push(code);
    }
    return hierarchy;
  }

  function renderSidebar() {
    const hierarchy = buildHierarchy();
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = "";

    let firstKey = "";

    Object.keys(hierarchy).sort().forEach(series => {
      const sTitle = document.createElement("div");
      sTitle.className = "series-header";
      sTitle.innerText = `${series} 系列`;
      sidebar.appendChild(sTitle);

      const engKeys = Object.keys(hierarchy[series]).sort();
      engKeys.forEach(eng => {
        const chKeys = Object.keys(hierarchy[series][eng]).sort();
        chKeys.forEach(chName => {
          const codes = hierarchy[series][eng][chName];
          if (!firstKey) firstKey = chName;

          const btn = document.createElement("div");
          btn.className = `product-btn ${chName === (selectedProductKey || firstKey) ? 'active' : ''}`;
          btn.innerHTML = `
            <span>${chName}</span>
            <span class="count-badge">${codes.length}組</span>
          `;
          btn.onclick = () => {
            selectedProductKey = chName;
            renderSidebar();
            renderContent(chName, codes);
          };
          sidebar.appendChild(btn);
        });
      });
    });

    if (!selectedProductKey) selectedProductKey = firstKey;
    let currentCodes = [];
    for (const s of Object.keys(hierarchy)) {
      for (const e of Object.keys(hierarchy[s])) {
        if (hierarchy[s][e][selectedProductKey]) {
          currentCodes = hierarchy[s][e][selectedProductKey];
          break;
        }
      }
    }
    renderContent(selectedProductKey, currentCodes);
  }

  function renderContent(chName, codes) {
    const container = document.getElementById("groupWrapper");
    container.innerHTML = "";
    if (!codes || codes.length === 0) return;

    const box = document.createElement("div");
    box.className = "product-box";

    let rowsHtml = "";
    codes.forEach(code => {
      const item = shopData.products[code];
      const origRaw = item.originalPrice;
      const isOrigPending = (origRaw === "待補" || origRaw === "" || origRaw === undefined);
      const origDisplay = isOrigPending ? "待補" : `$${Number(origRaw).toLocaleString()}`;
      const saleVal = item.salePrice ?? "";

      let saveHtml = "-";
      if (!isOrigPending && saleVal !== "" && saleVal !== "待補") {
        const save = Number(origRaw) - Number(saleVal);
        saveHtml = save > 0 ? `<span class="save-tag">省 $${save.toLocaleString()}</span>` : `$0`;
      }

      const instText = calcInstallment(saleVal);

      rowsHtml += `
        <tr>
          <td><span class="val-pill val-code">${code}</span></td>
          <td><span class="val-pill">${item.unitCount || '1'} 組</span></td>
          <td><span class="val-pill">${origDisplay}</span></td>
          <td>
            <input type="text" class="price-input" id="sale_${code}" value="${saleVal}" placeholder="優惠價" oninput="handleRowChange('${code}', '${origRaw}')">
          </td>
          <td><span class="val-pill">${item.spec || '-'}</span></td>
          <td id="save_${code}">${saveHtml}</td>
          <td id="inst_${code}"><span class="inst-tag">${instText}</span></td>
          <td>
            <input type="text" class="text-input" id="promo_${code}" value="${item.promoDiscount || ''}" placeholder="例: 滿2盒9折 / 買二送一" oninput="handleRowChange('${code}', '${origRaw}')">
          </td>
          <td>
            <input type="text" class="text-input" id="gift_${code}" value="${item.giftReward || ''}" placeholder="例: 體驗包 / 滿額保溫瓶" oninput="handleRowChange('${code}', '${origRaw}')">
          </td>
        </tr>
      `;
    });

    box.innerHTML = `
      <div class="product-box-title">
        <span>📦 ${chName}</span>
        <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">共 ${codes.length} 個組數品項</span>
      </div>
      <table class="spec-table">
        <thead>
          <tr>
            <th style="width: 80px;">代碼</th>
            <th style="width: 75px;">組數</th>
            <th style="width: 95px;">原價</th>
            <th style="width: 120px;">優惠特價</th>
            <th style="width: 110px;">規格內容</th>
            <th style="width: 95px;">現省多少</th>
            <th style="width: 160px;">分期付款</th>
            <th style="width: 170px;">活動折扣設定</th>
            <th style="width: 170px;">滿額贈禮</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
    container.appendChild(box);
  }

  function handleRowChange(code, origRaw) {
    const saleVal = document.getElementById(`sale_${code}`).value.trim();
    const promoVal = document.getElementById(`promo_${code}`).value.trim();
    const giftVal = document.getElementById(`gift_${code}`).value.trim();

    shopData.products[code].salePrice = saleVal;
    shopData.products[code].promoDiscount = promoVal;
    shopData.products[code].giftReward = giftVal;

    const saveEl = document.getElementById(`save_${code}`);
    if (origRaw !== "待補" && origRaw !== "" && saleVal !== "") {
      const save = Number(origRaw) - Number(saleVal);
      shopData.products[code].saveAmount = save > 0 ? save : 0;
      saveEl.innerHTML = save > 0 ? `<span class="save-tag">省 $${save.toLocaleString()}</span>` : `$0`;
    } else {
      saveEl.innerHTML = "-";
      shopData.products[code].saveAmount = 0;
    }

    const instEl = document.getElementById(`inst_${code}`);
    const instText = calcInstallment(saleVal);
    shopData.products[code].installmentText = instText;
    instEl.innerHTML = `<span class="inst-tag">${instText}</span>`;
  }

  // 標準 CSV 解析器：能夠正確處理雙引號包夾的千分位 "1,980"
  function parseStandardCSV(text) {
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const next = text[i + 1];

      if (c === '"') {
        if (inQuotes && next === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (c === ',' && !inQuotes) {
        row.push(cur.trim());
        cur = "";
      } else if ((c === '\r' || c === '\n') && !inQuotes) {
        if (c === '\r' && next === '\n') i++;
        row.push(cur.trim());
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
        cur = "";
      } else {
        cur += c;
      }
    }
    if (cur || row.length > 0) {
      row.push(cur.trim());
      rows.push(row);
    }
    return rows;
  }

  // 線上同步
  async function fetchFromGoogleSheet() {
    try {
      const btn = event.target;
      const originalText = btn.innerHTML;
      btn.innerHTML = "⏳ 抓取中...";
      btn.disabled = true;

      const res = await fetch(GSHEET_CSV_URL);
      if (!res.ok) throw new Error("無法連線至 Google 試算表");
      const csvText = await res.text();
      
      const rows = parseStandardCSV(csvText);
      processParsedRows(rows);

      btn.innerHTML = originalText;
      btn.disabled = false;
      alert("🎉 成功同步！千分位價格已完美對齊！請檢查後點擊「儲存並發布」！");
    } catch (e) {
      alert("同步失敗：" + e.message);
    }
  }

  function processParsedRows(rows) {
    let count = 0;
    rows.forEach(cols => {
      if (!cols[0] || cols[0] === "商品代碼") return;

      const code = cols[0];
      if (!shopData.products[code]) shopData.products[code] = {};

      const series = cols[1] || "其他";
      const english = cols[2] || "";
      const chinese = cols[3] || "";
      const unit = cols[4] || "1";
      const content = cols[5] || "";
      const origVal = cols[6] ? cols[6].replace(/,/g, '') : "";
      const saleVal = cols[7] ? cols[7].replace(/,/g, '') : "";

      shopData.products[code].series = series;
      shopData.products[code].english = english;
      shopData.products[code].chineseName = chinese;
      shopData.products[code].unitCount = unit;
      shopData.products[code].spec = content ? `${content} (${unit}組)` : `${unit}組`;
      shopData.products[code].originalPrice = origVal;
      shopData.products[code].salePrice = saleVal;

      if (origVal !== "待補" && origVal !== "" && saleVal !== "") {
        const diff = Number(origVal) - Number(saleVal);
        shopData.products[code].saveAmount = diff > 0 ? diff : 0;
      }

      shopData.products[code].installmentText = calcInstallment(saleVal);
      count++;
    });

    renderSidebar();
  }

  // 手動貼上解析
  function importFromTSV() {
    const raw = document.getElementById("tsvInput").value.trim();
    if (!raw) return alert("請貼上試算表內容！");
    const rows = raw.split("\n").map(line => line.split("\t").map(c => c.trim().replace(/^["']|["']$/g, '')));
    processParsedRows(rows);
    closeModal();
    alert("🎉 手動匯入完成！請確認後點擊「儲存並發布」！");
    document.getElementById("tsvInput").value = "";
  }

  async function saveToGitHub() {
    const token = localStorage.getItem("gh_token");
    shopData.countdownEnd = document.getElementById("countdownEnd").value;

    const fileContent = "window.SHOP_DATA = " + JSON.stringify(shopData, null, 2) + ";";
    const encoded = btoa(unescape(encodeURIComponent(fileContent)));

    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Fix CSV parsing for comma separated prices",
          content: encoded,
          sha: currentFileSha
        })
      });

      if (!res.ok) throw new Error("儲存失敗，請檢查網路連線");
      const data = await res.json();
      currentFileSha = data.content.sha;
      alert("🎉 儲存成功！全站資料已同步更新！");
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
