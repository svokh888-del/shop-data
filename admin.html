<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電商商品與促銷中控台</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #38bdf8;
      --border: #475569;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* 置頂工具列 */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 14px; }
    .title { font-weight: 700; font-size: 16px; color: #fff; white-space: nowrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card-bg); color: #fff; border: 1px solid var(--border);
      padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: 0.15s; white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: var(--primary); color: #022c22; border: none; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }

    /* 主雙欄版型 */
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    
    /* 左側母項目 */
    .sidebar {
      width: 280px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .category-item {
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 1px solid rgba(71, 85, 105, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      transition: 0.15s;
    }
    .category-item:hover { background: rgba(255,255,255,0.04); }
    .category-item.active { background: #24344d; border-left: 4px solid var(--accent); color: #fff; }
    .badge { background: #475569; color: #e2e8f0; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

    /* 右側子項目編輯區 */
    .content-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      background: var(--bg);
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .sub-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }
    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .sub-title { font-weight: 700; font-size: 15px; color: #fff; }
    .code-tag { background: rgba(56, 189, 248, 0.15); color: var(--accent); font-family: monospace; font-size: 12px; padding: 2px 6px; border-radius: 4px; }

    /* 表單元件 */
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    input[type="text"], input[type="datetime-local"], textarea {
      width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 13px; outline: none; transition: 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }

    /* 匯入 Modal 彈窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-box {
      background: var(--panel-bg); width: 90%; max-width: 560px; border-radius: 10px;
      padding: 20px; border: 1px solid var(--border);
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

    /* 登入小框 */
    #loginMask {
      position: fixed; inset: 0; background: var(--bg); display: flex;
      align-items: center; justify-content: center; z-index: 2000;
    }
    .login-box { background: var(--panel-bg); padding: 30px; border-radius: 12px; width: 400px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<!-- 登入驗證層 -->
<div id="loginMask">
  <div class="login-box">
    <h3 style="margin-bottom: 14px;">後台金鑰驗證</h3>
    <div class="form-group">
      <label>GitHub Personal Access Token：</label>
      <input type="text" id="tokenInput" placeholder="ghp_...">
    </div>
    <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="login()">驗證解鎖</button>
  </div>
</div>

<!-- 頂部工具列 -->
<header>
  <div class="header-left">
    <div class="title">⚡ 促銷中控台</div>
    <button class="btn" onclick="openModal()">📋 匯入試算表</button>
    <div style="display: flex; align-items: center; gap: 8px; margin-left: 10px;">
      <span style="font-size: 13px; color: var(--text-muted);">⏰ 倒數截止：</span>
      <input type="datetime-local" id="countdownEnd" style="width: 200px; padding: 4px 8px;">
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-primary" onclick="saveToGitHub()">🚀 儲存並發布到全站</button>
  </div>
</header>

<!-- 主工作區域 -->
<div class="main-layout">
  <!-- 左欄：母項目分類 -->
  <div class="sidebar">
    <div class="sidebar-title">商品母項目列表</div>
    <div id="categoryList"></div>
  </div>

  <!-- 右欄：子項目組數編輯 -->
  <div class="content-area">
    <div id="gridContainer" class="grid-container"></div>
  </div>
</div>

<!-- 匯入彈跳視窗 -->
<div id="importModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-bottom: 8px;">貼上 Google 試算表內容</h3>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
      請在 Google 試算表中框選並複製你的表格（連同商品代碼、中文、原價、優惠價等整排貼上）：
    </p>
    <textarea id="tsvInput" rows="8" placeholder="在此貼上 (Ctrl+V)..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="importFromTSV()">自動識別並匯入</button>
    </div>
  </div>
</div>

<script>
  const OWNER = "svokh888-del";
  const REPO = "shop-data";
  const PATH = "data.js";
  let currentFileSha = "";
  let shopData = { countdownEnd: "", products: {} };
  let selectedCategory = "";

  function openModal() { document.getElementById("importModal").style.display = "flex"; }
  function closeModal() { document.getElementById("importModal").style.display = "none"; }

  function login() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) return alert("請輸入 Token 金鑰");
    localStorage.setItem("gh_token", token);
    loadData();
  }

  window.onload = function() {
    const token = localStorage.getItem("gh_token");
    if (token) {
      document.getElementById("tokenInput").value = token;
      loadData();
    }
  };

  async function loadData() {
    const token = localStorage.getItem("gh_token");
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      if (!res.ok) throw new Error("讀取失敗，請確認 Token 與權限");
      const json = await res.json();
      currentFileSha = json.sha;
      const decodedContent = decodeURIComponent(escape(atob(json.content)));
      
      const match = decodedContent.match(/window\.SHOP_DATA\s*=\s*(\{[\s\S]*\});?/);
      if (match && match[1]) {
        shopData = eval(`(${match[1]})`);
      }
      document.getElementById("loginMask").style.display = "none";
      document.getElementById("countdownEnd").value = shopData.countdownEnd || "";
      renderLayout();
    } catch (e) {
      alert(e.message);
    }
  }

  // 取得母品名分類邏輯
  function getCategoryName(name) {
    if (!name) return "未分類商品";
    return name.replace(/\s*\d+\s*(組|包|盒).*$/, '').trim();
  }

  function renderLayout() {
    const categories = {};
    for (const [code, item] of Object.entries(shopData.products)) {
      const cat = getCategoryName(item.name || code);
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(code);
    }

    const catList = document.getElementById("categoryList");
    catList.innerHTML = "";

    const catKeys = Object.keys(categories);
    if (!selectedCategory || !categories[selectedCategory]) {
      selectedCategory = catKeys[0] || "";
    }

    catKeys.forEach(cat => {
      const div = document.createElement("div");
      div.className = `category-item ${cat === selectedCategory ? 'active' : ''}`;
      div.innerHTML = `
        <span>${cat}</span>
        <span class="badge">${categories[cat].length} 組</span>
      `;
      div.onclick = () => {
        selectedCategory = cat;
        renderLayout();
      };
      catList.appendChild(div);
    });

    renderSubItems(categories[selectedCategory] || []);
  }

  function renderSubItems(codes) {
    const container = document.getElementById("gridContainer");
    container.innerHTML = "";

    codes.forEach(code => {
      const item = shopData.products[code];
      const div = document.createElement("div");
      div.className = "sub-card";
      div.innerHTML = `
        <div class="sub-header">
          <span class="sub-title">${item.name || code}</span>
          <span class="code-tag">${code}</span>
        </div>
        <div class="row">
          <div class="form-group">
            <label>原價</label>
            <input type="text" id="orig_${code}" value="${item.originalPrice ?? ''}" onchange="syncField('${code}')">
          </div>
          <div class="form-group">
            <label>優惠特價</label>
            <input type="text" id="sale_${code}" value="${item.salePrice ?? ''}" onchange="syncField('${code}')">
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>促銷標籤 (例: 買3送1)</label>
            <input type="text" id="promo_${code}" value="${item.promoTitle || ''}" onchange="syncField('${code}')">
          </div>
          <div class="form-group">
            <label>規格文字 (例: 20入×3盒)</label>
            <input type="text" id="spec_${code}" value="${item.spec || ''}" onchange="syncField('${code}')">
          </div>
        </div>
        <div class="form-group">
          <label>贈品名稱標籤 (無贈品請留空)</label>
          <input type="text" id="gift_${code}" value="${item.giftName || ''}" placeholder="例: 虎奶菇體驗包" onchange="syncField('${code}')">
        </div>
        <div class="form-group">
          <label>分期說明 (留空不顯示)</label>
          <input type="text" id="inst_${code}" value="${item.installmentText || ''}" placeholder="例: 3期0利率" onchange="syncField('${code}')">
        </div>
      `;
      container.appendChild(div);
    });
  }

  function syncField(code) {
    if (!shopData.products[code]) return;
    const orig = Number(document.getElementById(`orig_${code}`).value) || 0;
    const sale = Number(document.getElementById(`sale_${code}`).value) || 0;
    shopData.products[code].originalPrice = orig;
    shopData.products[code].salePrice = sale;
    shopData.products[code].saveAmount = (orig > sale) ? (orig - sale) : 0;
    shopData.products[code].promoTitle = document.getElementById(`promo_${code}`).value;
    shopData.products[code].spec = document.getElementById(`spec_${code}`).value;
    shopData.products[code].giftName = document.getElementById(`gift_${code}`).value;
    shopData.products[code].installmentText = document.getElementById(`inst_${code}`).value;
  }

  function importFromTSV() {
    const raw = document.getElementById("tsvInput").value.trim();
    if (!raw) return alert("請先貼上內容！");
    const rows = raw.split("\n");
    let count = 0;

    rows.forEach(row => {
      const cols = row.split("\t").map(c => c.trim());
      if (cols[0] === "商品代碼" || !cols[0]) return;

      const code = cols[0];
      if (!shopData.products[code]) shopData.products[code] = {};

      const engName = cols[3] || "";
      const chName = cols[4] || "";
      const groupCount = cols[5] ? `${cols[5]}組` : "";
      shopData.products[code].name = `${engName} ${chName} ${groupCount}`.trim() || shopData.products[code].name || code;
      
      if (cols[6]) {
        shopData.products[code].spec = cols[6] + (cols[5] ? ` (共${cols[5]}組)` : "");
      }

      const parsePrice = (v) => (!v || v === "待補") ? "" : (Number(v.replace(/,/g, '')) || "");
      const orig = parsePrice(cols[7]);
      const sale = parsePrice(cols[8]);

      if (orig !== "") shopData.products[code].originalPrice = orig;
      if (sale !== "") shopData.products[code].salePrice = sale;

      const save = parsePrice(cols[9]);
      if (save !== "") {
        shopData.products[code].saveAmount = save;
      } else if (orig && sale && orig > sale) {
        shopData.products[code].saveAmount = orig - sale;
      }

      if (cols[10]) shopData.products[code].installmentText = cols[10];
      count++;
    });

    closeModal();
    renderLayout();
    alert(`🎉 已成功匯入並歸類 ${count} 個品項！請點擊右上角「儲存並發布」！`);
    document.getElementById("tsvInput").value = "";
  }

  async function saveToGitHub() {
    const token = localStorage.getItem("gh_token");
    shopData.countdownEnd = document.getElementById("countdownEnd").value;

    const fileContent = "window.SHOP_DATA = " + JSON.stringify(shopData, null, 2) + ";";
    const encoded = btoa(unescape(encodeURIComponent(fileContent)));

    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Update shop-data via Master-Detail Admin",
          content: encoded,
          sha: currentFileSha
        })
      });

      if (!res.ok) throw new Error("儲存失敗，請檢查網路狀態");
      const data = await res.json();
      currentFileSha = data.content.sha;
      alert("🎉 儲存成功！全站資料庫已同步！");
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
