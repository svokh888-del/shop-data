<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電商商品與促銷中控台</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #283347;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #38bdf8;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --save-color: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* 頂部置頂工具列 */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
    .title { font-weight: 700; font-size: 15px; color: #fff; white-space: nowrap; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #334155; color: #fff; border: 1px solid var(--border);
      padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: 0.15s; white-space: nowrap;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: var(--primary); color: #022c22; border: none; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }

    /* 雙欄主架構 */
    .main-layout { display: flex; flex: 1; overflow: hidden; }

    /* 左側大分類清單 */
    .sidebar {
      width: 260px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-title {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .category-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(71, 85, 105, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      transition: 0.15s;
    }
    .category-item:hover { background: rgba(255,255,255,0.04); }
    .category-item.active { background: #24344d; border-left: 4px solid var(--accent); color: #fff; font-weight: 700; }
    .badge { background: #334155; color: #94a3b8; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

    /* 右側條狀列表 */
    .content-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: var(--bg);
    }
    .strip-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .strip-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s;
    }
    .strip-card:hover { border-color: #475569; }

    /* 上方標題列 */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .product-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .code-tag {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      font-family: monospace;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* 下方橫排數值列：組數 / 原價 / 優惠特價 / 規格組數 / 現省 */
    .card-bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .col-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .col-cell label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .col-cell input {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: 0.15s;
    }
    .col-cell input:focus { border-color: var(--accent); }

    /* 自動計算現省展示框 */
    .save-box {
      min-width: 100px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 6px;
      color: var(--save-color);
      font-weight: 700;
      font-size: 13px;
    }

    /* 彈窗 & 登入層 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-box {
      background: var(--panel-bg); width: 90%; max-width: 540px; border-radius: 10px;
      padding: 20px; border: 1px solid var(--border);
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    #loginMask {
      position: fixed; inset: 0; background: var(--bg); display: flex;
      align-items: center; justify-content: center; z-index: 2000;
    }
    .login-box { background: var(--panel-bg); padding: 28px; border-radius: 10px; width: 380px; border: 1px solid var(--border); }
  </style>
</head>
<body>

<!-- 登入驗證層 -->
<div id="loginMask">
  <div class="login-box">
    <h3 style="margin-bottom: 12px; font-size: 16px;">後台金鑰驗證</h3>
    <div style="margin-bottom: 12px;">
      <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">GitHub Personal Access Token：</label>
      <input type="text" id="tokenInput" placeholder="ghp_..." style="width: 100%; padding: 8px 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff;">
    </div>
    <button class="btn btn-primary" style="width: 100%;" onclick="login()">驗證解鎖</button>
  </div>
</div>

<!-- 頂部置頂工具列 -->
<header>
  <div class="header-left">
    <div class="title">⚡ 促銷中控台</div>
    <button class="btn" onclick="openModal()">📋 匯入試算表</button>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; color: var(--text-muted);">⏰ 促銷倒數截止：</span>
      <input type="datetime-local" id="countdownEnd" style="width: 190px; padding: 4px 8px; background: #0f172a; border: 1px solid var(--border); border-radius: 4px; color: #fff; font-size: 12px;">
    </div>
  </div>
  <div class="header-right">
    <button class="btn btn-primary" onclick="saveToGitHub()">🚀 儲存並發布到全站</button>
  </div>
</header>

<!-- 主工作雙欄 -->
<div class="main-layout">
  <!-- 左欄：大分類 (依商品代碼系列) -->
  <div class="sidebar">
    <div class="sidebar-title">系列大分類</div>
    <div id="categoryList"></div>
  </div>

  <!-- 右欄：長方形條狀子項目 -->
  <div class="content-area">
    <div id="stripContainer" class="strip-list"></div>
  </div>
</div>

<!-- 匯入試算表彈窗 -->
<div id="importModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-bottom: 8px; font-size: 15px;">貼上 Google 試算表</h3>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">
      在試算表框選複製商品內容（含代碼、品名、原價、優惠價），直接貼上即可自動對齊：
    </p>
    <textarea id="tsvInput" rows="7" placeholder="在此貼上 (Ctrl+V)..." style="width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 12px; outline: none;"></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="importFromTSV()">自動識別並匯入</button>
    </div>
  </div>
</div>

<script>
  const OWNER = "svokh888-del";
  const REPO = "shop-data";
  const PATH = "data.js";
  let currentFileSha = "";
  let shopData = { countdownEnd: "", products: {} };
  let selectedCategory = "";

  function openModal() { document.getElementById("importModal").style.display = "flex"; }
  function closeModal() { document.getElementById("importModal").style.display = "none"; }

  function login() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) return alert("請輸入 Token 金鑰");
    localStorage.setItem("gh_token", token);
    loadData();
  }

  window.onload = function() {
    const token = localStorage.getItem("gh_token");
    if (token) {
      document.getElementById("tokenInput").value = token;
      loadData();
    }
  };

  async function loadData() {
    const token = localStorage.getItem("gh_token");
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        headers: { "Authorization": `token ${token}` }
      });
      if (!res.ok) throw new Error("讀取失敗，請確認 Token 與權限");
      const json = await res.json();
      currentFileSha = json.sha;
      const decodedContent = decodeURIComponent(escape(atob(json.content)));
      
      const match = decodedContent.match(/window\.SHOP_DATA\s*=\s*(\{[\s\S]*\});?/);
      if (match && match[1]) {
        shopData = eval(`(${match[1]})`);
      }
      document.getElementById("loginMask").style.display = "none";
      document.getElementById("countdownEnd").value = shopData.countdownEnd || "";
      renderLayout();
    } catch (e) {
      alert(e.message);
    }
  }

  // 取得大分類邏輯：依代碼前綴 (sp, sps, bg, bl) + 系列中文
  function getCategoryKey(code, item) {
    const prefix = code.split("-")[0].replace(/\d+/g, "");
    let seriesName = "";
    if (item.series) {
      seriesName = item.series;
    } else if (item.name) {
      seriesName = item.name.split(" ")[0] || prefix;
    } else {
      seriesName = prefix.toUpperCase();
    }
    return `${prefix.toUpperCase()} 系列 (${seriesName})`;
  }

  function renderLayout() {
    const categories = {};
    for (const [code, item] of Object.entries(shopData.products)) {
      const cat = getCategoryKey(code, item);
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(code);
    }

    const catList = document.getElementById("categoryList");
    catList.innerHTML = "";

    const catKeys = Object.keys(categories);
    if (!selectedCategory || !categories[selectedCategory]) {
      selectedCategory = catKeys[0] || "";
    }

    catKeys.forEach(cat => {
      const div = document.createElement("div");
      div.className = `category-item ${cat === selectedCategory ? 'active' : ''}`;
      div.innerHTML = `
        <span>${cat}</span>
        <span class="badge">${categories[cat].length} 組</span>
      `;
      div.onclick = () => {
        selectedCategory = cat;
        renderLayout();
      };
      catList.appendChild(div);
    });

    renderStripItems(categories[selectedCategory] || []);
  }

  // 渲染右側長條項目
  function renderStripItems(codes) {
    const container = document.getElementById("stripContainer");
    container.innerHTML = "";

    codes.forEach(code => {
      const item = shopData.products[code];
      const orig = Number(item.originalPrice) || 0;
      const sale = Number(item.salePrice) || 0;
      const save = (orig && sale && orig > sale) ? (orig - sale) : 0;

      const div = document.createElement("div");
      div.className = "strip-card";
      div.innerHTML = `
        <div class="card-top">
          <span class="product-title">${item.name || code}</span>
          <span class="code-tag">${code}</span>
        </div>

        <div class="card-bottom">
          <div class="col-cell" style="width: 75px;">
            <label>組數</label>
            <input type="text" id="unit_${code}" value="${item.unitCount || '1'}" oninput="syncField('${code}')">
          </div>

          <div class="col-cell" style="width: 100px;">
            <label>原價</label>
            <input type="text" id="orig_${code}" value="${item.originalPrice ?? ''}" oninput="syncField('${code}')">
          </div>

          <div class="col-cell" style="width: 100px;">
            <label>優惠特價</label>
            <input type="text" id="sale_${code}" value="${item.salePrice ?? ''}" oninput="syncField('${code}')">
          </div>

          <div class="col-cell" style="flex: 1; min-width: 140px;">
            <label>規格描述 (如: 60錠×1盒)</label>
            <input type="text" id="spec_${code}" value="${item.spec || ''}" oninput="syncField('${code}')">
          </div>

          <div class="col-cell" style="width: 110px;">
            <label>現省金額</label>
            <div class="save-box" id="save_box_${code}">省 $${save.toLocaleString()}</div>
          </div>

          <div class="col-cell" style="width: 140px;">
            <label>促銷/贈品標註</label>
            <input type="text" id="gift_${code}" value="${item.giftName || ''}" placeholder="無贈品留空" oninput="syncField('${code}')">
          </div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  // 實時更新數值與計算現省
  function syncField(code) {
    if (!shopData.products[code]) return;
    const orig = Number(document.getElementById(`orig_${code}`).value) || 0;
    const sale = Number(document.getElementById(`sale_${code}`).value) || 0;
    const save = (orig > sale) ? (orig - sale) : 0;

    shopData.products[code].unitCount = document.getElementById(`unit_${code}`).value;
    shopData.products[code].originalPrice = orig;
    shopData.products[code].salePrice = sale;
    shopData.products[code].saveAmount = save;
    shopData.products[code].spec = document.getElementById(`spec_${code}`).value;
    shopData.products[code].giftName = document.getElementById(`gift_${code}`).value;

    const saveBox = document.getElementById(`save_box_${code}`);
    if (saveBox) {
      saveBox.innerText = `省 $${save.toLocaleString()}`;
    }
  }

  function importFromTSV() {
    const raw = document.getElementById("tsvInput").value.trim();
    if (!raw) return alert("請先貼上試算表內容！");
    const rows = raw.split("\n");
    let count = 0;

    rows.forEach(row => {
      const cols = row.split("\t").map(c => c.trim());
      if (cols[0] === "商品代碼" || !cols[0]) return;

      const code = cols[0];
      if (!shopData.products[code]) shopData.products[code] = {};

      const series = cols[2] || "";
      const engName = cols[3] || "";
      const chName = cols[4] || "";
      const unit = cols[5] || "1";

      shopData.products[code].series = series;
      shopData.products[code].unitCount = unit;
      shopData.products[code].name = `${engName} ${chName} ${unit}組`.trim();

      if (cols[6]) {
        shopData.products[code].spec = cols[6] + ` (${unit}組)`;
      }

      const parsePrice = (v) => (!v || v === "待補") ? "" : (Number(v.replace(/,/g, '')) || "");
      const orig = parsePrice(cols[7]);
      const sale = parsePrice(cols[8]);

      if (orig !== "") shopData.products[code].originalPrice = orig;
      if (sale !== "") shopData.products[code].salePrice = sale;

      const save = (orig && sale && orig > sale) ? (orig - sale) : 0;
      shopData.products[code].saveAmount = save;

      count++;
    });

    closeModal();
    renderLayout();
    alert(`🎉 成功匯入並解析 ${count} 筆商品！請檢視並點擊右上角「儲存並發布」！`);
    document.getElementById("tsvInput").value = "";
  }

  async function saveToGitHub() {
    const token = localStorage.getItem("gh_token");
    shopData.countdownEnd = document.getElementById("countdownEnd").value;

    const fileContent = "window.SHOP_DATA = " + JSON.stringify(shopData, null, 2) + ";";
    const encoded = btoa(unescape(encodeURIComponent(fileContent)));

    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "Update shop-data via Strip List Admin",
          content: encoded,
          sha: currentFileSha
        })
      });

      if (!res.ok) throw new Error("儲存失敗，請檢查網路連線");
      const data = await res.json();
      currentFileSha = data.content.sha;
      alert("🎉 儲存成功！全站資料已同步更新！");
    } catch (e) {
      alert(e.message);
    }
  }
</script>
</body>
</html>
